name: table_table
description: Convert pasted or piped tables to Slack-native TSV or Markdown.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.4.0

dependencies:
  ansi_regex: ^0.1.2
  args: ^2.7.0
  characters: ^1.4.1
  csslib: ^1.0.2
  east_asian_width: ^1.0.1
  emoji_regex: ^0.0.5
  ffi: ^2.1.3
  html: ^0.15.6
  source_span: ^1.10.0

dev_dependencies:
  lints: ^4.0.0
  string_width: ^0.1.5
  test: ^1.25.2

executables:
  table-table: table_table
  slack-table: slack_table
  md-table: md_table
