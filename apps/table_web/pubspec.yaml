name: table_table_web
description: A small browser frontend for slack_table.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  jaspr: ^0.23.5
  slack_table:
    path: ../..
  web: ^1.1.1

dev_dependencies:
  build_runner: ^2.4.0
  build_web_compilers: ^4.8.5
  jaspr_builder: ^0.23.5
  jaspr_cli: ^0.23.5
  jaspr_lints: ^0.7.2
  jaspr_test: ^0.23.5
  lints: ^6.0.0

jaspr:
  mode: client
  styles: standalone
